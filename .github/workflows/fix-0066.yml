name: Fix migration 0066
on:
  push:
    branches: [refactor/remover-custo-produto-financeiro]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remover-custo-produto-financeiro
      - name: Remover cast indevido
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/0066_limpa_campos_legados_das_funcoes.sql')
          s=p.read_text()
          old="    select id into v_existente from public.vendas where id=p_idempotency_key::uuid and false;\n"
          if old not in s:
              raise SystemExit('linha esperada não encontrada')
          p.write_text(s.replace(old,''))
          PY
          git diff --check
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/0066_limpa_campos_legados_das_funcoes.sql
          git commit -m "fix: corrige idempotência da migration 0066"
          git push origin HEAD:refactor/remover-custo-produto-financeiro
