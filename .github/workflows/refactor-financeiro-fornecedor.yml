name: Ajuste boletos fornecedor

on:
  push:
    branches:
      - refactor/remover-custo-produto-financeiro

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remover-custo-produto-financeiro
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar ajuste financeiro
        run: python scripts/refactor_financeiro_fornecedor.py
      - name: Conferir diff
        run: git diff --check
      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/financeiro-simplificado.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "feat: boletos de fornecedor parcelados no financeiro"
          git push origin HEAD:refactor/remover-custo-produto-financeiro
