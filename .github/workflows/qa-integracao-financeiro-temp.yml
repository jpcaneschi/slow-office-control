name: QA integração financeiro temporário

on:
  push:
    branches:
      - fix/financeiro-boletos-sem-produto

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_for_static_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
