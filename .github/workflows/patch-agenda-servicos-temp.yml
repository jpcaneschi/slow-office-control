name: Patch agenda servicos temp
on:
  push:
    branches: [feat/promissorias-produto-dashboard-servicos]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/promissorias-produto-dashboard-servicos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ajusta agenda e limpeza
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('components/dashboard/agenda-operacao.tsx')
          s=p.read_text()
          s=s.replace('  recebimento: "#059669",\n  compra:', '  recebimento: "#059669",\n  servico: "#0d9488",\n  compra:')
          s=s.replace('  recebimento: "Recebimentos",\n  compra:', '  recebimento: "Recebimentos",\n  servico: "Serviços",\n  compra:')
          s=s.replace('Vendas, compras, despesas, folha, cobranças e eventos em um único lugar.', 'Vendas, serviços, compras, despesas, folha, cobranças e eventos em um único lugar.')
          p.write_text(s)

          p=Path('components/dashboard/dashboard-home.tsx')
          s=p.read_text()
          s=re.sub(r'\nfunction somaConcluidas\(vendas: Venda\[\], inicio: Date, fim: Date\) \{.*?\n\}\n\nfunction dentroDoPeriodo', '\nfunction dentroDoPeriodo', s, flags=re.S)
          p.write_text(s)
          PY
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/agenda-operacao.tsx components/dashboard/dashboard-home.tsx
          git commit -m "fix: integra servicos visualmente na agenda" || exit 0
          git push origin HEAD:feat/promissorias-produto-dashboard-servicos
