name: Fix final promissorias temp
on:
  push:
    branches: [feat/promissorias-produto-dashboard-servicos]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/promissorias-produto-dashboard-servicos
      - name: Corrige referencia e limpa diagnosticos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/dashboard/dashboard-home.tsx')
          s=p.read_text()
          old='totalValor={vendasPeriodoContratadas}'
          if old not in s:
            raise SystemExit('referencia antiga não encontrada')
          s=s.replace(old,'totalValor={vendasRecebidas}')
          p.write_text(s)
          PY
          rm -f tsc-errors.tmp.txt .github/workflows/diag-tsc-temp.yml .github/workflows/fix-final-promissorias-temp.yml
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finaliza sincronizacao de recebimentos" || exit 0
          git push origin HEAD:feat/promissorias-produto-dashboard-servicos
