name: Patch cliente timeline temp
on:
  push:
    branches:
      - feat/busca-timeline-alertas
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/busca-timeline-alertas
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_cliente_timeline.py
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/clientes/'[id]'/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: adiciona timeline cronológica ao cliente"
          git push origin HEAD:feat/busca-timeline-alertas
