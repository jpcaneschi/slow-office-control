name: QA remove custo temporario

on:
  push:
    branches:
      - refactor/remover-custo-produto-financeiro

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
