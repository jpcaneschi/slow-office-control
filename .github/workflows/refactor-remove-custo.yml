name: Refactor remove custo legado

on:
  push:
    branches:
      - refactor/remover-custo-produto-financeiro

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remover-custo-produto-financeiro
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar refatoração
        run: python scripts/refactor_remove_custo.py
      - name: Conferir alterações
        run: |
          git diff --check
          git status --short
      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib tests
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "refactor: remove custo de produto da operação futura"
          git push origin HEAD:refactor/remover-custo-produto-financeiro
