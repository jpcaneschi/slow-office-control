name: Patch bonificacao temp
on:
  push:
    branches:
      - feat/busca-timeline-alertas
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/busca-timeline-alertas
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_bonificacao_distribuida.py
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/folha/page.tsx supabase/migrations/0070_bonificacao_distribuida_na_folha.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: distribui bonificacao nos pagamentos do mes seguinte"
          git push origin HEAD:feat/busca-timeline-alertas
