name: Read Next docs temp
on:
  push:
    branches:
      - feat/busca-timeline-alertas
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read relevant Next docs
        run: |
          echo '--- CLIENT COMPONENTS ---'
          find node_modules/next/dist/docs -type f | grep -Ei 'client-component|server-and-client|use-client' | head -n 5
          F=$(find node_modules/next/dist/docs -type f | grep -Ei 'server-and-client|client-component|use-client' | head -n 1); [ -n "$F" ] && sed -n '1,240p' "$F" || true
          echo '--- ROUTING/LINK ---'
          F2=$(find node_modules/next/dist/docs -type f | grep -Ei '/link|linking-and-navigating|navigation' | head -n 1); [ -n "$F2" ] && sed -n '1,220p' "$F2" || true
