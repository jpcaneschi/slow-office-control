name: Patch boletos flexíveis temporário

on:
  push:
    branches:
      - fix/financeiro-boletos-sem-produto

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/financeiro-boletos-sem-produto
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python scripts/patch_boletos_flexiveis.py
      - name: Conferir diff
        run: git diff --check
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/financeiro-simplificado.tsx app/dashboard/financeiro/page.tsx app/dashboard/condicional/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: boletos de fornecedor com datas livres"
          git push origin HEAD:fix/financeiro-boletos-sem-produto
