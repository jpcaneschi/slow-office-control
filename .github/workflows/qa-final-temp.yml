name: QA final temporaria
on:
  push:
    branches: [refactor/remover-custo-produto-financeiro]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Testes
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
